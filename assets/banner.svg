<svg fill="none" viewBox="0 0 1200 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080711"/>
      <stop offset="50%" stop-color="#0F0E24"/>
      <stop offset="100%" stop-color="#070613"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="35%" stop-color="#A855F7"/>
      <stop offset="70%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="border-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
    <filter id="glow-indigo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" result="blur"/>
    </filter>
    <filter id="drop-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#A855F7" flood-opacity="0.45"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E1B4B" stroke-width="0.8" stroke-opacity="0.5"/>
      <circle cx="0" cy="0" r="1" fill="#EC4899" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .title { font-weight: 800; letter-spacing: -0.02em; }
    .sub { font-weight: 600; letter-spacing: 0.05em; }
    .tag { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
    .live-status { animation: pulse 2s infinite ease-in-out; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.92); }
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-gradient)"/>

  <!-- Cyber Grid Overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#cyber-grid)"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="150" cy="80" r="160" fill="#EC4899" fill-opacity="0.12" filter="url(#glow-magenta)"/>
  <circle cx="1050" cy="280" r="180" fill="#6366F1" fill-opacity="0.14" filter="url(#glow-indigo)"/>
  <circle cx="850" cy="70" r="120" fill="#38BDF8" fill-opacity="0.08" filter="url(#glow-magenta)"/>

  <!-- Outer Card Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#border-gradient)" stroke-width="1.5"/>

  <!-- Tech Crosshair / Corner Accents -->
  <g opacity="0.75">
    <path d="M 35 50 L 35 35 L 50 35" stroke="#EC4899" stroke-width="2.5" fill="none"/>
    <path d="M 1165 50 L 1165 35 L 1150 35" stroke="#38BDF8" stroke-width="2.5" fill="none"/>
    <path d="M 35 310 L 35 325 L 50 325" stroke="#EC4899" stroke-width="2.5" fill="none"/>
    <path d="M 1165 310 L 1165 325 L 1150 325" stroke="#38BDF8" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Top Pill: Status / Award Badge -->
  <g transform="translate(60, 46)">
    <rect width="455" height="30" rx="15" fill="#2E1065" fill-opacity="0.85" stroke="#A855F7" stroke-width="1"/>
    <circle cx="16" cy="15" r="4.5" fill="#F59E0B"/>
    <text x="28" y="19.5" fill="#F3E8FF" class="font-mono tag" font-size="11.5">🎖️ DEAN'S LIST HONORS • KDU FACULTY OF COMPUTING</text>
  </g>

  <!-- Available for Work Pill -->
  <g transform="translate(530, 46)">
    <rect width="230" height="30" rx="15" fill="#064E3B" fill-opacity="0.75" stroke="#10B981" stroke-width="1"/>
    <circle cx="16" cy="15" r="4.5" fill="#34D399" class="live-status"/>
    <text x="28" y="19.5" fill="#D1FAE5" class="font-mono tag" font-size="11.5">OPEN FOR ROLES &amp; COLLAB</text>
  </g>

  <!-- Main Name Heading -->
  <text x="60" y="142" fill="url(#text-gradient)" class="font-sans title" font-size="44" filter="url(#drop-glow)">
    RUWINIKA RODRIGO
  </text>

  <!-- Subtitle / Role -->
  <g transform="translate(60, 182)">
    <text x="0" y="0" fill="#F8FAFC" class="font-sans sub" font-size="17">
      SENIOR SOFTWARE ENGINEER • UI/UX SPECIALIST
    </text>
    <text x="430" y="0" fill="#64748B" class="font-mono" font-size="18">|</text>
    <text x="450" y="0" fill="#C084FC" class="font-sans" font-size="15" font-weight="600">
      MSc in IT (Reading) • BSc (Hons) IT 2nd Upper
    </text>
  </g>

  <!-- Value Proposition Description -->
  <text x="60" y="222" fill="#CBD5E1" class="font-sans" font-size="14.5" font-weight="400">
    Bridging human-centered UI/UX design with scalable Angular &amp; Blazor frontends and enterprise Power Platform automation.
  </text>
  <text x="60" y="244" fill="#94A3B8" class="font-sans" font-size="13.5" font-weight="400">
    Transforming complex workflows into intuitive, WCAG-accessible digital interfaces, intranet architectures, and design systems.
  </text>

  <!-- Core Pillar Badges (Bottom Row) -->
  <g transform="translate(60, 282)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="185" height="34" rx="8" fill="#18142E" fill-opacity="0.85" stroke="#3730A3" stroke-width="1"/>
      <circle cx="16" cy="17" r="3.5" fill="#EC4899"/>
      <text x="28" y="22" fill="#F1F5F9" class="font-mono tag">🎨 UI/UX &amp; Figma</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(197, 0)">
      <rect width="180" height="34" rx="8" fill="#18142E" fill-opacity="0.85" stroke="#3730A3" stroke-width="1"/>
      <circle cx="16" cy="17" r="3.5" fill="#A855F7"/>
      <text x="28" y="22" fill="#F1F5F9" class="font-mono tag">⚡ Angular &amp; Blazor</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(389, 0)">
      <rect width="210" height="34" rx="8" fill="#18142E" fill-opacity="0.85" stroke="#3730A3" stroke-width="1"/>
      <circle cx="16" cy="17" r="3.5" fill="#6366F1"/>
      <text x="28" y="22" fill="#F1F5F9" class="font-mono tag">💼 MS Power Platform</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(611, 0)">
      <rect width="195" height="34" rx="8" fill="#18142E" fill-opacity="0.85" stroke="#3730A3" stroke-width="1"/>
      <circle cx="16" cy="17" r="3.5" fill="#38BDF8"/>
      <text x="28" y="22" fill="#F1F5F9" class="font-mono tag">🌐 SharePoint Intranets</text>
    </g>

    <!-- Pill 5 -->
    <g transform="translate(818, 0)">
      <rect width="185" height="34" rx="8" fill="#18142E" fill-opacity="0.85" stroke="#3730A3" stroke-width="1"/>
      <circle cx="16" cy="17" r="3.5" fill="#10B981"/>
      <text x="28" y="22" fill="#F1F5F9" class="font-mono tag">♿ WCAG Accessibility</text>
    </g>
  </g>
</svg>
