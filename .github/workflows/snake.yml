name: Generate Snake Contribution Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark&color_snake=purple

      - name: Commit & Push
        run: |
          git config user.name "Ruwinika Rodrigo"
          git config user.email "truwinikarodrigo@gmail.com"
          git add assets/snake.svg assets/snake-dark.svg
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🐍 Update snake contribution animation [skip ci]"
            git push origin main || true
          fi
